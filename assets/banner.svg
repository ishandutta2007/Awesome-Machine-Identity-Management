<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="titleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Linear Gradients for Accent Paths -->
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="accentGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <style>
    .bg-grid {
      stroke: #1e293b;
      stroke-width: 1;
      stroke-opacity: 0.4;
    }
    
    /* Dynamic CSS Keyframes for Subtle Motion */
    @keyframes pulseLine {
      0%, 100% { stroke-opacity: 0.3; stroke-dashoffset: 0; }
      50% { stroke-opacity: 0.9; stroke-dashoffset: 40; }
    }

    @keyframes nodeGlow {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    @keyframes floatRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .animated-path-1 {
      stroke-dasharray: 12 8;
      animation: pulseLine 6s linear infinite;
    }

    .animated-path-2 {
      stroke-dasharray: 8 6;
      animation: pulseLine 8s linear reverse infinite;
    }

    .pulsing-node {
      transform-origin: center;
      animation: nodeGlow 4s ease-in-out infinite;
    }

    .rotating-ring {
      transform-origin: 1050px 180px;
      animation: floatRing 25s linear infinite;
    }
    
    .rotating-ring-left {
      transform-origin: 150px 180px;
      animation: floatRing 30s linear reverse infinite;
    }

    .banner-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }

    .banner-subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }

    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
  </style>

  <!-- Base Layer: Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />

  <!-- Grid Pattern -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Cryptographic Identity Mesh (Background/Midground) -->
  <g opacity="0.6">
    <!-- Connecting Dynamic Paths -->
    <path class="animated-path-1" d="M 100 80 Q 300 20 500 90 T 900 60 T 1100 120" fill="none" stroke="url(#accentGrad1)" stroke-width="2" />
    <path class="animated-path-2" d="M 80 280 Q 350 340 650 270 T 1120 260" fill="none" stroke="url(#accentGrad2)" stroke-width="2" />
    <path class="animated-path-1" d="M 150 180 L 1050 180" fill="none" stroke="#475569" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Left Rotating Cyber Shield Geometry -->
    <g class="rotating-ring-left" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.3">
      <polygon points="150,130 193,155 193,205 150,230 107,205 107,155" />
      <circle cx="150" cy="180" r="65" stroke-dasharray="6 6" />
    </g>

    <!-- Right Rotating Cyber Shield Geometry -->
    <g class="rotating-ring" stroke="#818cf8" stroke-width="1.5" fill="none" opacity="0.3">
      <polygon points="1050,130 1093,155 1093,205 1050,230 1007,205 1007,155" />
      <circle cx="1050" cy="180" r="65" stroke-dasharray="6 6" />
    </g>

    <!-- Pulsing Nodes -->
    <circle class="pulsing-node" cx="150" cy="180" r="8" fill="#38bdf8" filter="url(#glow)" />
    <circle class="pulsing-node" cx="300" cy="90" r="6" fill="#818cf8" filter="url(#glow)" />
    <circle class="pulsing-node" cx="900" cy="60" r="7" fill="#34d399" filter="url(#glow)" />
    <circle class="pulsing-node" cx="1050" cy="180" r="8" fill="#c084fc" filter="url(#glow)" />
    <circle class="pulsing-node" cx="650" cy="270" r="6" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- Badges Pill Containers (Midground) -->
  <g transform="translate(0, 20)">
    <rect x="240" y="240" width="160" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <text x="320" y="262" class="badge-text" text-anchor="middle">🔐 PKI &amp; TLS/SSL</text>

    <rect x="420" y="240" width="170" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1" opacity="0.9" />
    <text x="505" y="262" class="badge-text" text-anchor="middle">🆔 SPIFFE / SPIRE</text>

    <rect x="610" y="240" width="180" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1" opacity="0.9" />
    <text x="700" y="262" class="badge-text" text-anchor="middle">📜 Certificate Lifecycle</text>

    <rect x="810" y="240" width="150" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-width="1" opacity="0.9" />
    <text x="885" y="262" class="badge-text" text-anchor="middle">🔑 Machine Secrets</text>
  </g>

  <!-- Foreground Title and Subtitle (Guaranteed Unhidden & Clear) -->
  <g text-anchor="middle">
    <!-- Icon/Shield Accent Top -->
    <g transform="translate(600, 75)" filter="url(#titleGlow)">
      <path d="M -16 -12 L 0 -22 L 16 -12 L 16 8 Q 0 20 -16 8 Z" fill="none" stroke="#38bdf8" stroke-width="3" />
      <circle cx="0" cy="-2" r="4" fill="#34d399" />
    </g>

    <!-- Main Title -->
    <text x="600" y="142" class="banner-title" filter="url(#titleGlow)">
      Awesome Machine Identity Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="180" class="banner-subtitle">
      Curated List of SaaS Platforms &amp; Open-Source PKI, Workload Identity &amp; CLM
    </text>
  </g>
</svg>
